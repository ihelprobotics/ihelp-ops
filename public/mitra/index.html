<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>MITRA app build board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style id="app-css">
:root{
  --paper:#FBF8F2; --panel:#FFFFFF; --wash:#F4EFE5; --ink:#2A2620; --muted:#6B6458; --line:#E4DCCD; --line2:#D3C8B4;
  --gold:#9C7C2E; --gold-ink:#6E561C; --gold-wash:#F3EBD6;
  --s-todo:#7C766A; --s-prog:#2E6683; --s-rev:#62539A; --s-block:#A3432A; --s-done:#3D7547; --s-def:#9A948A;
  --display:"Cormorant","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"DM Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(251,248,242,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 0 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{font:600 26px/1.1 var(--display);margin:0;letter-spacing:.2px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.spacer{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;min-height:38px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold-ink);border-color:var(--gold-ink);color:#fff}
.btn.primary:hover{background:#5A4616}
.btn.primary[disabled]{background:var(--wash);border-color:var(--line);color:var(--muted);cursor:default}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--s-block);border-color:#E7C9BE}
.savestate{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 14px 11px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
.notice{margin:14px 0 0;padding:10px 14px;border:1px solid var(--line2);background:var(--gold-wash);border-radius:8px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
main{padding:22px 0 60px}
h2.sec{font:600 30px/1.15 var(--display);margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 20px;max-width:70ch}
/* overview */
.ov-grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:24px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px 20px}
.ring-box{text-align:center}
.ring-box .big{font:600 44px/1 var(--display)}
.ring-box .lbl{color:var(--muted);font-size:13px}
.statrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px;text-align:left}
.stat{padding:8px 10px;border-radius:8px;background:var(--wash);font-size:13px;color:var(--muted);border:0;text-align:left}
.stat b{display:block;font:600 22px/1.1 var(--sans);color:var(--ink)}
.stat:hover{outline:1px solid var(--line2)}
.epic-row{display:grid;grid-template-columns:minmax(150px,230px) 1fr 64px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.epic-row:last-child{border-bottom:0}
.epic-row:hover .epic-name{color:var(--gold-ink)}
.epic-name{font-weight:500;font-size:14px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--wash)}
.bar span{display:block;height:100%}
.epic-count{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:4px 0 8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
.mini-list{list-style:none;margin:0;padding:0}
.mini-list li{border-top:1px solid var(--line)}
.mini-list li:first-child{border-top:0}
.mini-list button{width:100%;text-align:left;background:none;border:0;padding:9px 0;display:flex;gap:10px;align-items:baseline}
.mini-list button:hover .t{color:var(--gold-ink)}
.mono-id{font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px;color:var(--gold-ink);min-width:44px}
.h3{font:600 21px/1.2 var(--display);margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input[type=search]{flex:1 1 220px;min-width:180px}
.field{border:1px solid var(--line2);border-radius:8px;background:var(--panel);padding:8px 10px;min-height:38px;font-size:14px}
select.field{padding-right:28px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:0 6px}
.count-note{font-size:13px;color:var(--muted);margin-left:auto}
/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--wash);border-radius:var(--r);padding:10px;min-height:200px;display:flex;flex-direction:column}
.col.over{outline:2px dashed var(--gold)}
.col h4{margin:2px 4px 10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.col h4 .n{color:var(--muted);font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:grab;text-align:left;width:100%;display:block}
.tcard:hover{border-color:var(--line2)}
.tcard.dragging{opacity:.4}
.tcard .row1{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.tcard .ttl{font-size:14px;font-weight:500;line-height:1.35}
.tcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--wash);color:var(--muted);white-space:nowrap}
.tag.size{background:var(--gold-wash);color:var(--gold-ink);font-weight:600}
.tag.gate{background:#F6E6DF;color:var(--s-block);font-weight:600}
.tag.who{background:#E8F0F3;color:var(--s-prog)}
.tag.wait{background:#EEE;color:#6a655c}
.col .more{font-size:13px;color:var(--muted);text-align:center;padding:6px}
/* list */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.list{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}
table.list th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--wash);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
table.list td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tr:hover td{background:#FDFBF6}
td.tcell button{background:none;border:0;padding:0;text-align:left;font-weight:500}
td.tcell button:hover{color:var(--gold-ink);text-decoration:underline}
table.list .field{min-height:32px;padding:4px 8px;font-size:13.5px}
.epic-chip{font-size:12.5px;color:var(--muted)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(42,38,32,.28);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--panel);z-index:41;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(42,38,32,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.dr-head{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dr-body{overflow-y:auto;padding:18px 20px 30px;flex:1}
.dr-title{width:100%;font:600 24px/1.2 var(--display);border:1px solid transparent;border-radius:6px;padding:4px 6px;margin:0 -6px 12px;background:none}
.dr-title:hover,.dr-title:focus{border-color:var(--line2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
label.f.full{grid-column:1/-1}
label.f textarea{min-height:70px;resize:vertical;line-height:1.45;font-size:14px;color:var(--ink)}
label.f .field{color:var(--ink)}
.deps{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dep{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.dep:hover{border-color:var(--gold)}
.dr-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
/* decisions */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.dcard{padding:16px 18px;border-left:4px solid var(--line2)}
.dcard[data-st=DECIDED]{border-left-color:var(--s-done)}
.dcard[data-st=OPEN]{border-left-color:var(--s-block)}
.dcard[data-st=ACTION]{border-left-color:var(--gold)}
.dcard .top{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.dcard h4{margin:0 0 8px;font-size:15.5px;font-weight:600;line-height:1.35}
.dcard dl{margin:0 0 10px;font-size:13.5px}
.dcard dt{font-weight:600;color:var(--muted);font-size:12px;margin-top:8px}
.dcard dd{margin:2px 0 0}
.dcard textarea{width:100%;min-height:64px;resize:vertical}
.pill{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid}
/* tests */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.tst{padding:16px 18px}
.tst h4{font:600 22px/1.15 var(--display);margin:0 0 6px}
.tst .does{margin:0 0 10px}
.tst .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tst details{border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.tst summary{cursor:pointer;font-weight:500;font-size:14px;color:var(--gold-ink)}
.tst p{margin:6px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:60}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:860px){
  .ov-grid,.two{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .epic-row{grid-template-columns:1fr 54px}
  .epic-row .bar{grid-column:1/-1;order:3}
  .brand h1{font-size:22px}
}
/* iHelp Ops additions */
.opshome{margin-right:4px;color:var(--gold-ink);text-decoration:none}
.tag.ops{background:#E8F0F3;color:var(--s-prog);font-weight:600}
.tcard.linked{cursor:pointer}
.opsbox{border:1px solid var(--line2);background:var(--wash);border-radius:8px;padding:12px 14px;margin:0 0 16px;font-size:14px}
.opsbox p{margin:6px 0 0}
.opsbox a{color:var(--gold-ink);font-weight:500}
.opsrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.opsrow select{flex:1 1 200px;min-width:0}
.opserr{color:var(--s-block)}
</style>
</head>

": "Chatbot model and ticket destination", "why": "Where chats are processed; where tickets land (email, Slack, Trello).", "rec": "Decide; record in Z-04.", "blocks": "H-02, H-04", "decision": "recommendation only said 'decide'. Needs a named model/vendor and a destination (email, Slack or Trello).", "status": "OPEN", "date": "09-Oct-2026"}, {"id": "D-13", "title": "Who can consent for a user who can't?", "why": "Adult with cognitive impairment: guardian consent rules need counsel's view.", "rec": "Counsel opinion before K-05 ships.", "blocks": "A-03, K-05", "decision": "get counsel's opinion before K-05 ships.", "status": "ACTION", "date": "09-Oct-2026"}, {"id": "D-14", "title": "Web stack and hosting", "why": "Must share auth with mobile; India region functions.", "rec": "Next.js on Vercel (Mumbai functions) against the same backend.", "blocks": "W-01, C-06", "decision": "Next.js on Vercel (Mumbai functions), same backend.", "status": "DECIDED", "date": "09-Oct-2026"}], "tests": [{"name": "Finger Tap", "does": "Tap index finger on thumb as fast and wide as possible, 10 s each hand", "sensor": "Camera — hands", "time": "~1 min", "freq": "2×/week", "metrics": "Tap count, rate, mean amplitude, amplitude decrement (first vs last third, slope), rhythm variability (CV of inter-tap interval), hesitations (gap >2× median), L/R asymmetry", "validity": "Correct hand; hand in frame ≥90%; fps ≥25; ≥5 taps", "phase": "Phase 1", "method": "MediaPipe-style hand landmarks (21 pts). Signal = thumb tip–index tip distance ÷ wrist–middle-knuckle distance (removes camera distance). Peak detection on smoothed signal."}, {"name": "Hand Open-Close", "does": "Open and close hand fully, fast, 10 s each hand", "sensor": "Camera — hands", "time": "~1 min", "freq": "2×/week", "metrics": "Cycle count, rate, amplitude, decrement, variability", "validity": "As Finger Tap", "phase": "Phase 1", "method": "Aperture = mean fingertip-to-wrist distance, normalised"}, {"name": "Still Hands + Arms Out", "Day, date, place", "does": "Answer 3 simple questions", "sensor": "Mic + STT", "time": "30 s", "freq": "Monthly", "metrics": "Correct/incorrect, response time", "validity": "Second-voice flag", "phase": "Phase 1 (EN/HI/KN)", "method": "Fuzzy match incl. local calendar terms"}, {"name": "Word recall (now)", "does": "Repeat 5 words the app says", "sensor": "Mic + STT", "time": "30 s", "freq": "Monthly (rotating list)", "metrics": "Words recalled, intrusions, response time", "validity": "Second-voice flag", "phase": "Phase 1 (EN/HI/KN)", "method": "6 alternate lists per language"}, {"name": "Animal naming", "does": "Name as many animals as possible in 60 s", "sensor": "Mic + STT", "time": "1 min", "freq": "Monthly", "metrics": "Unique animals, repeats, non-animals, count per 15 s", "validity": "Second-voice flag", "phase": "Phase 1 (EN/HI/KN)", "method": "Per-language animal lexicon incl. local names"}, {"name": "Word recall (later)", "does": "Recall the 5 words again", "sensor": "Mic + STT", "time": "30 s", "freq": "Monthly", "metrics": "Words recalled", "validity": "Second-voice flag", "phase": "Phase 1 (EN/HI/KN)", "method": "Animal naming is the filler task"}, {"name": "Family questionnaire", "does": "Family member answers 12 change questions", "sensor": "Touch", "time": "3 min", "freq": "Monthly", "metrics": "% of applicable items rated worse; 2 safety flags", "validity": "—", "phase": "Hold (D-06)", "method": "Draft v0.1 from 8 Oct; needs clinician review"}]}</script>
<script id="app-js">
(function(){
"use strict";
const STATUSES=["To do","In progress","In review","Blocked","Done","Deferred (v1.1)"];
const BOARD_COLS=["To do","In progress","In review","Blocked","Done"];
const SCOLOR={"To do":"var(--s-todo)","In progress":"var(--s-prog)","In review":"var(--s-rev)","Blocked":"var(--s-block)","Done":"var(--s-done)","Deferred (v1.1)":"var(--s-def)"};
const DSTAT={DECIDED:["Decided","var(--s-done)","#E6F0E1"],OPEN:["Open","var(--s-block)","#F6E6DF"],ACTION:["Action","var(--gold-ink)","#F3EBD6"]};
const DRAFT_KEY="mitra-board-draft";
const raw=document.getElementById("board-data").textContent;
let S=JSON.parse(raw);
let dirty=false, canSave=null, writeMode="pending", artifactNS=null, downloadsNS=null;
const ui={tab:"overview",q:"",epic:"",status:"",size:"",skill:"",who:"",ready:false,open:null,sort:"id",dir:1};
try{const u=JSON.parse(sessionStorage.getItem("mitra-ui")||"null");if(u)Object.assign(ui,u,{open:null});}catch(e){}

/* ---------- draft persistence ---------- */
function loadDraft(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY)||"null")}catch(e){return null}}
function saveDraft(extra){try{localStorage.setItem(DRAFT_KEY,JSON.stringify(Object.assign({base:S.savedAt,state:S},extra||{})))}catch(e){}}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}
let staleDraft=null;
(function(){
  const d=loadDraft(); if(!d)return;
  if(d.pending && d.pending===S.savedAt){clearDraft();return;}          // our save landed
  if(d.base===S.savedAt){S=d.state;dirty=true;return;}                  // unsaved edits on this version
  staleDraft=d;                                                          // edits made on an older version
})();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function epicName(e){return String(e||"").replace(/^\d+\s+/,"")}
function byId(id){return S.tasks.find(t=>t.id===id)}
function parseDeps(s){
  s=String(s||""); const out=[];
  s.replace(/([A-Z$])-(\d{2})\s*(?:\.\.|–)\s*\1-(\d{2})/g,(m,p,a,b)=>{for(let i=+a;i<=+b;i++)out.push(p+"-"+String(i).padStart(2,"0"));return""})
   .replace(/[A-Z$]-\d{2}/g,m=>{out.push(m);return m});
  return [...new Set(out)].filter(byId);
}
function decStatus(id){const d=S.decisions.find(x=>x.id===id);return d?d.status:null}
function gateOpen(t){return /^D-\d+/.test(t.gate||"") && decStatus(t.gate)!=="DECIDED"}
function depsDone(t){return parseDeps(t.deps).every(id=>byId(id).status==="Done")}
function isReady(t){return t.status==="To do" && depsDone(t) && !gateOpen(t)}
function epics(){const m=new Map();S.tasks.forEach(t=>{if(!m.has(t.epic))m.set(t.epic,[]);m.get(t.epic).push(t)});return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}))}
function skillsList(){return [...new Set(S.tasks.map(t=>t.skills).filter(Boolean))].sort()}
function whoList(){return [...new Set(S.tasks.map(t=>t.assignee).filter(Boolean))].sort()}
function toast(msg){const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function persistUI(){try{sessionStorage.setItem("mitra-ui",JSON.stringify(ui))}catch(e){}}
function changed(){if(writeMode==="live"){syncQueue();return;}dirty=true;saveDraft();renderTop();}

function filtered(){
  const q=ui.q.trim().toLowerCase();
  return S.tasks.filter(t=>{
    if(ui.epic&&t.epic!==ui.epic)return false;
    if(ui.status&&t.status!==ui.status)return false;
    if(ui.size&&t.size!==ui.size)return false;
    if(ui.skill&&t.skills!==ui.skill)return false;
    if(ui.who==="__none"&&t.assignee)return false;
    if(ui.who&&ui.who!=="__none"&&t.assignee!==ui.who)return false;
    if(ui.ready&&!isReady(t))return false;
    if(q){const h=(t.id+" "+t.title+" "+t.what+" "+t.deliv+" "+t.skills+" "+t.assignee+" "+t.notes).toLowerCase();if(!h.includes(q))return false;}
    return true;
  });
}

/* ---------- shell ---------- */
function mark(size,pct){
  // incomplete-circle mark; the gap is what remains
  const r=size/2-size*0.09, c=2*Math.PI*r, p=Math.max(0,Math.min(1,pct==null?0.82:pct));
  const sw=size*0.09;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/>
   ${p>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--gold)" stroke-width="${sw}" stroke-linecap="round"
    stroke-dasharray="${(c*p).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>`:""}</svg>`;
}
function renderShell(){
  $("#root").innerHTML=`
  <header class="top"><div class="wrap">
    <div class="topbar">
      <div class="brand">${mark(34,0.8)}<div><h1>MITRA app build board</h1><p>${esc(S.version)}, ${S.tasks.length} tasks, iHelp Robotics internal</p></div></div>
      <div class="spacer"></div>
      <span class="savestate" id="savestate" aria-live="polite"></span>
      <button class="btn" id="addBtn">Add task</button>
      <button class="btn" id="expBtn" hidden>Export CSV</button>
      <button class="btn primary" id="saveBtn" disabled>Save changes</button>
    </div>
    <nav class="tabs" role="tablist">
      ${[["overview","Overview"],["board","Board"],["list","All tasks"],["decisions","Decisions"],["tests","Test battery"]].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${ui.tab===k}">${l}</button>`).join("")}
    </nav>
  </div></header>
  <div class="wrap"><div id="notices"></div><main id="main"></main></div>`;
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;persistUI();document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));renderMain();});
  $("#saveBtn").onclick=save; $("#addBtn").onclick=addTask; $("#expBtn").onclick=exportCSV;
  renderTop(); renderNotices();
}
function renderTop(){
  const sb=$("#saveBtn"), ss=$("#savestate"); if(!sb)return;
  if(writeMode==="readonly"){sb.hidden=true;ss.textContent="View only";$("#addBtn").hidden=true;return;}
  if(writeMode==="live"){sb.hidden=true;ss.textContent=signedOut?"Signed out. Reload to sign in.":syncErr?"Offline. Retrying…":(queue.length||inflight)?"Saving…":"All changes saved";return;}
  if(writeMode==="local"){sb.hidden=true;ss.textContent=dirty?"Edits kept in this browser":"";return;}
  sb.hidden=false; sb.disabled=!dirty||writeMode!=="shared";
  ss.textContent=dirty?"Unsaved changes":(writeMode==="pending"?"Connecting":"All changes saved");
}
function renderNotices(){
  const n=$("#notices"); if(!n)return; let h="";
  if(staleDraft){h+=`<div class="notice"><span>You have edits from an earlier version of this board that were never saved. Someone has saved a newer version since.</span><span class="spacer"></span><button class="btn" id="rsDraft">Restore my edits</button><button class="btn ghost" id="dsDraft">Discard</button></div>`;}
  if(writeMode==="local"){h+=`<div class="notice"><span>Can't reach the shared board right now. Your edits are kept in this browser only. Reload to try again.</span></div>`;}
  n.innerHTML=h;
  if(staleDraft){$("#rsDraft").onclick=()=>{if(writeMode==="live"){restoreDraftLive(staleDraft.state);clearDraft();}else S=staleDraft.state;staleDraft=null;changed();renderNotices();renderMain();};$("#dsDraft").onclick=()=>{staleDraft=null;clearDraft();renderNotices();};}
}

/* ---------- views ---------- */
function renderMain(){
  const m=$("#main");
  ({overview:viewOverview,board:viewBoard,list:viewList,decisions:viewDecisions,tests:viewTests})[ui.tab](m);
}
function statusBar(list){
  const n=list.length||1;
  return `<div class="bar" role="img" aria-label="${STATUSES.map(s=>s+": "+list.filter(t=>t.status===s).length).join(", ")}">`+
    STATUSES.map(s=>{const c=list.filter(t=>t.status===s).length;return c?`<span style="width:${c/n*100}%;background:${SCOLOR[s]}"></span>`:""}).join("")+`</div>`;
}
function legend(){return `<div class="legend">${STATUSES.map(s=>`<span><i style="background:${SCOLOR[s]}"></i>${s}</span>`).join("")}</div>`}
function viewOverview(m){
  const T=S.tasks, done=T.filter(t=>t.status==="Done").length, active=T.filter(t=>t.status!=="Deferred (v1.1)").length;
  const pct=active?done/active:0;
  const ready=T.filter(isReady);
  const openD=S.decisions.filter(d=>d.status!=="DECIDED");
  const gated=T.filter(gateOpen).length;
  const who=new Map();T.forEach(t=>{if(!t.assignee||t.status==="Done")return;who.set(t.assignee,(who.get(t.assignee)||0)+1)});
  const unassigned=T.filter(t=>!t.assignee&&t.status!=="Done"&&t.status!=="Deferred (v1.1)").length;
  m.innerHTML=`
  <h2 class="sec">Where the build stands</h2>
  <p class="lede">Every task is one person's work for one to three days. Click any number, area or task to open it.</p>
  <div class="ov-grid">
    <div class="card pad ring-box">
      ${mark(170,pct)}
      <div style="margin-top:-112px;margin-bottom:66px"><div class="big">${Math.round(pct*100)}%</div><div class="lbl">${done} of ${active} done</div></div>
      <div class="statrow">
        <button class="stat" data-go="ready"><b>${ready.length}</b>ready to start</button>
        <button class="stat" data-go="In progress"><b>${T.filter(t=>t.status==="In progress").length}</b>in progress</button>
        <button class="stat" data-go="Blocked"><b>${T.filter(t=>t.status==="Blocked").length}</b>blocked</button>
        <button class="stat" data-go="decisions"><b>${openD.length}</b>open decisions, holding ${gated} tasks</button>
      </div>
    </div>
    <div class="card pad">
      <div class="h3">Progress by area</div>${legend()}
      ${epics().map(([e,l])=>`<button class="epic-row" data-epic="${esc(e)}"><span class="epic-name">${esc(epicName(e))}</span>${statusBar(l)}<span class="epic-count">${l.filter(t=>t.status==="Done").length}/${l.length}</span></button>`).join("")}
    </div>
  </div>
  <div class="two">
    <div class="card pad"><div class="h3">Ready to start now</div>
      <p class="small muted" style="margin:-4px 0 8px">Nothing it depends on is unfinished and no open decision is holding it.</p>
      ${ready.length?`<ul class="mini-list">${ready.slice(0,12).map(t=>`<li><button data-open="${esc(t.id)}"><span class="mono-id">${esc(t.id)}</span><span class="t">${esc(t.title)}</span><span class="tag size" style="margin-left:auto">${esc(t.size)}</span></button></li>`).join("")}</ul>${ready.length>12?`<button class="btn ghost small" data-go="ready" style="padding-left:0">See all ${ready.length}</button>`:""}`:`<div class="empty">Nothing is ready. Finish an in-progress task or close a decision.</div>`}
    </div>
    <div class="card pad"><div class="h3">Who has what</div>
      <ul class="mini-list">
      ${[...who.entries()].sort((a,b)=>b[1]-a[1]).map(([w,c])=>`<li><button data-who="${esc(w)}"><span class="t" style="font-weight:500">${esc(w)}</span><span class="muted small" style="margin-left:auto">${c} open</span></button></li>`).join("")}
      <li><button data-who="__none"><span class="t" style="font-weight:500">Not assigned yet</span><span class="muted small" style="margin-left:auto">${unassigned} open</span></button></li>
      </ul>
      <div class="h3" style="margin-top:20px">Open decisions</div>
      <ul class="mini-list">${openD.map(d=>`<li><button data-go="decisions"><span class="mono-id">${esc(d.id)}</span><span class="t">${esc(d.title)}</span></button></li>`).join("")||`<li class="muted small" style="padding:8px 0">All decisions are made.</li>`}</ul>
    </div>
  </div>`;
  m.querySelectorAll("[data-epic]").forEach(b=>b.onclick=()=>goList({epic:b.dataset.epic}));
  m.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openTask(b.dataset.open));
  m.querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>goList({who:b.dataset.who}));
  m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const g=b.dataset.go;
    if(g==="decisions"){switchTab("decisions");return;}
    if(g==="ready"){goList({ready:true});return;}
    goList({status:g});});

/* ---------- live sync (Vercel + Redis) ---------- */
const API="/api/mitra/board";
let signedOut=false;
let B=null, rev=null, queue=[], inflight=false, syncErr=false, writeSeq=0, renderLater=false, pollT=null, retryMs=2000;
const snap=x=>JSON.parse(JSON.stringify(x));
const sv=v=>String(v==null?"":v);
async function api(method,body,q,path){
  const r=await fetch((path||API)+(q||""),{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  // A lapsed session is redirected to the sign-in page, which fetch follows.
  if(r.status===401||(r.redirected&&/\/login/.test(r.url))){signedOut=true;renderTop();throw new Error("You are signed out of iHelp Ops. Reload the page to sign in again.");}
  let j=null; try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error((j&&j.error)||("The server answered "+r.status+"."));e.status=r.status;e.body=j;throw e;}
  return j;
}
function diffKind(kind,list,base){
  const seen=new Set();
  list.forEach(x=>{
    seen.add(x.id); const b=base.get(x.id);
    if(!b){const f=Object.assign({},x);delete f.id;queue.push({op:"patch",kind,id:x.id,create:true,order:Date.now()+queue.length,fields:f});base.set(x.id,snap(x));return;}
    const f={};let n=0;
    Object.keys(x).forEach(k=>{if(k!=="id"&&sv(x[k])!==sv(b[k])){f[k]=x[k];n++;}});
    if(n){queue.push({op:"patch",kind,id:x.id,fields:f});Object.assign(b,f);}
  });
  [...base.keys()].forEach(id=>{if(!seen.has(id)){queue.push({op:"del",kind,id});base.delete(id);}});
}
function syncQueue(){
  revertLinked();
  diffKind("t",S.tasks,B.t); diffKind("d",S.decisions,B.d);
  if(queue.length){writeSeq++;flush();}
  renderTop();
}
function reId(op){
  if(op.kind!=="t"){B.d.delete(op.id);return;}
  const t=byId(op.id); B.t.delete(op.id); if(!t)return;
  const pref=op.id.split("-")[0]; let n=+op.id.split("-")[1]||1, id;
  do{n++;id=pref+"-"+String(n).padStart(2,"0");}while(byId(id));
  t.id=id; toast(`${op.id} was just taken by someone else. Your task is now ${id}.`);
  if(ui.open===op.id)openTask(id); else renderMain();
  syncQueue();
}
async function flush(){
  if(inflight||!queue.length)return;
  inflight=true; const ops=queue.splice(0,100); renderTop();
  let r;
  try{ r=await api("POST",{ops}); }
  catch(e){
    queue=ops.concat(queue); syncErr=true; renderTop();
    setTimeout(()=>{inflight=false;flush();},retryMs); retryMs=Math.min(retryMs*2,30000); return;
  }
  syncErr=false; retryMs=2000; inflight=false; writeSeq++;
  (r.results||[]).forEach((res,i)=>{
    if(!res.ok&&res.error==="id_taken")reId(ops[i]);
    if(!res.ok&&res.error==="linked"){rev=null;toast(`${ops[i].id} is started in Ops as a GitHub issue, so it can't be deleted here. Close the issue instead.`);}
  });
  if(queue.length)flush(); else {renderTop(); poll();}
}
function mergeList(list,remote){
  const byid=new Map(list.map(x=>[x.id,x])); let any=remote.length!==list.length;
  const out=remote.map((rx,i)=>{
    const lx=byid.get(rx.id);
    if(!lx){any=true;return rx;}
    Object.keys(rx).forEach(k=>{if(sv(lx[k])!==sv(rx[k])){lx[k]=rx[k];any=true;}});
    if(list[i]!==lx)any=true;
    return lx;
  });
  list.length=0; out.forEach(x=>list.push(x));
  return [any,new Map(out.map(x=>[x.id,snap(x)]))];
}
function busy(){const a=document.activeElement;return !!document.querySelector(".drawer")||!!(a&&a.closest&&a.closest("#main")&&a.matches("input,textarea,select"));}
function applyRemote(r){
  const [a,bt]=mergeList(S.tasks,r.tasks||[]), [b,bd]=mergeList(S.decisions,r.decisions||[]);
  B={t:bt,d:bd};
  applyLive();
  if(ui.open&&!byId(ui.open)){closeDrawer();toast("That task was deleted by someone else.");return;}
  if(a||b)renderLater=true;
}
function schedule(){clearTimeout(pollT);pollT=setTimeout(poll,document.hidden?30000:4000);}
async function poll(){
  clearTimeout(pollT);
  if(queue.length||inflight){schedule();return;}
  const seq=writeSeq;
  try{
    const r=await api("GET",null,rev!=null?"?rev="+rev:"");
    syncErr=false;
    if(!r.unchanged&&seq===writeSeq&&!queue.length&&!inflight){applyRemote(r);rev=r.rev;}
  }catch(e){syncErr=true;}
  if(renderLater&&!busy()){renderLater=false;renderMain();}
  renderTop(); schedule();
}
function restoreDraftLive(state){
  const orig=JSON.parse(raw);
  [["tasks"],["decisions"]].forEach(([k])=>{
    const om=new Map((orig[k]||[]).map(x=>[x.id,x])), dm=new Map((state[k]||[]).map(x=>[x.id,x]));
    (state[k]||[]).forEach(x=>{
      const o=om.get(x.id), cur=S[k].find(y=>y.id===x.id);
      if(!o){if(!cur)S[k].push(snap(x));return;}
      if(!cur)return;
      Object.keys(x).forEach(f=>{if(sv(x[f])!==sv(o[f]))cur[f]=x[f];});
    });
    om.forEach((o,id)=>{if(!dm.has(id))S[k]=S[k].filter(y=>y.id!==id);});
  });
}
async function goLive(){
  try{
    let r=await api("GET");
    if(!r.seeded){const seed=JSON.parse(raw);await api("POST",{seed:{tasks:seed.tasks,decisions:seed.decisions}});r=await api("GET");}
    if(dirty){staleDraft={state:S};dirty=false;}
    const base=JSON.parse(raw); base.tasks=[]; base.decisions=[]; S=base;
    applyRemote(r); rev=r.rev; renderLater=false;
    writeMode="live"; const eb=$("#expBtn"); if(eb)eb.hidden=false;
    renderTop(); renderNotices(); renderMain(); schedule(); opsBoot();
  }catch(e){writeMode="local";renderTop();renderNotices();opsBoot();}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&writeMode==="live")poll();});
window.addEventListener("beforeunload",e=>{if(writeMode==="live"&&(queue.length||inflight)){e.preventDefault();e.returnValue="";}});

/* ---------- iHelp Ops: tasks started as GitHub issues ---------- */
// A task with `issue` set (owner/name#n) is a GitHub issue now. Its column is
// derived by Ops from what happens on GitHub and can't be typed here; the
// server drops a typed status for it too.
const ISSUE=/^([A-Za-z0-9._-]+\/[A-Za-z0-9._-]+)#(\d+)$/;
let LIVE={}, liveErr="", START=null, startErr={}, starting=null;
const linkOf=t=>t&&ISSUE.test(t.issue||"")?t.issue:null;
const pendingOf=t=>!!(t&&/^pending:/.test(t.issue||""));
function applyLive(){
  S.tasks.forEach(t=>{
    const l=LIVE[t.id]; if(!linkOf(t)||!l||!l.column)return;
    t.status=l.column; const b=B&&B.t.get(t.id); if(b)b.status=l.column;
  });
}
function revertLinked(){
  if(!B)return;
  S.tasks.forEach(t=>{
    if(!linkOf(t)&&!pendingOf(t))return;
    const b=B.t.get(t.id); if(!b||t.status===b.status)return;
    t.status=b.status;
    toast(`${t.id} follows ${linkOf(t)||"its GitHub issue"}, so its column can't be changed here.`);
  });
}
async function pollLive(){
  clearTimeout(pollLive.t);
  try{const r=await api("GET",null,"","/api/mitra/live");LIVE=r.live||{};liveErr="";}
  catch(e){liveErr=e.message;}
  const before=S.tasks.map(t=>t.status).join("|");
  applyLive();
  if(S.tasks.map(t=>t.status).join("|")!==before){if(busy())renderLater=true;else renderMain();}
  refreshDrawer();
  pollLive.t=setTimeout(pollLive,document.hidden?120000:45000);
}
async function opsBoot(){
  try{START=await api("GET",null,"","/api/mitra/start");}
  catch(e){START={repos:[],canStart:false,why:e.message};}
  new MutationObserver(decorate).observe(document.body,{childList:true,subtree:true});
  decorate(); pollLive();
}
function liveTag(t){
  if(pendingOf(t))return `<span class="tag ops">Starting…</span>`;
  const ref=linkOf(t); if(!ref)return "";
  const l=LIVE[t.id], n="#"+ref.split("#")[1];
  return `<span class="tag ops" title="${esc(ref)}">${esc(n)}${l&&l.progress!=null?` · ${l.progress}%`:""}</span>`;
}
function decorate(){
  const bar=document.querySelector(".topbar");
  if(bar&&!bar.querySelector(".opshome")){
    const a=document.createElement("a");a.className="btn ghost opshome";a.href="/";a.textContent="← iHelp Ops";
    bar.insertBefore(a,bar.firstChild);
  }
  document.querySelectorAll(".tcard[data-id]:not([data-ops])").forEach(c=>{
    c.dataset.ops="1"; const t=byId(c.dataset.id); if(!t||(!linkOf(t)&&!pendingOf(t)))return;
    c.setAttribute("draggable","false"); c.classList.add("linked");
    const m=c.querySelector(".meta"); if(m)m.insertAdjacentHTML("afterbegin",liveTag(t));
  });
  document.querySelectorAll("select[data-f=status][data-id]:not([data-ops])").forEach(el=>{
    el.dataset.ops="1"; const t=byId(el.dataset.id);
    if(t&&(linkOf(t)||pendingOf(t))){el.disabled=true;el.title="Follows "+(linkOf(t)||"its GitHub issue");}
  });
  const dr=document.querySelector(".drawer");
  if(dr&&!dr.querySelector(".opsbox"))fillDrawer(dr);
}
function refreshDrawer(){const b=document.querySelector(".drawer .opsbox");if(b){b.remove();decorate();}}
function ghUrl(ref){const m=ISSUE.exec(ref);return m?`https://github.com/${m[1]}/issues/${m[2]}`:"#";}
function opsHref(ref){const m=ISSUE.exec(ref);return m?`/task/${m[1]}/${m[2]}`:"/";}
function fillDrawer(dr){
  const t=byId(ui.open); if(!t)return;
  const title=dr.querySelector(".dr-title"); if(!title)return;
  const box=document.createElement("div"); box.className="opsbox";
  const ref=linkOf(t), l=LIVE[t.id];
  if(ref||pendingOf(t)){
    const st=dr.querySelector("[data-k=status]"); if(st){st.disabled=true;st.title="Follows the GitHub issue";}
    const del=dr.querySelector("#dDel"); if(del)del.hidden=true;
  }
  if(ref){
    box.innerHTML=`<div class="opshead"><b>Started in Ops</b> as <a href="${esc(opsHref(ref))}">${esc(ref)}</a></div>`+
      (l&&l.error?`<p class="opserr">Its status can't be read right now: ${esc(l.error)}</p>`
       :l?`<p>${esc(l.stage)}${l.progress!=null?` (${l.progress}%)`:""}. The column follows GitHub: branch, pull request, review, merge. Nobody sets it by hand.</p>`
       :liveErr?`<p class="opserr">Status unavailable: ${esc(liveErr)}</p>`:`<p class="muted">Reading its status from GitHub…</p>`)+
      `<p class="small"><a href="${esc(opsHref(ref))}">Open the task in Ops</a> to put an agent on it or see the evidence. · <a href="${esc(ghUrl(ref))}" target="_blank" rel="noopener">View on GitHub</a></p>`;
  }else if(pendingOf(t)){
    box.innerHTML=`<div class="opshead"><b>Being started in Ops…</b></div><p class="muted">The GitHub issue is being opened. This updates in a moment.</p>`;
  }else{
    const s=START||{repos:[]}, err=startErr[t.id];
    const can=!!(s.canStart&&writeMode==="live"&&s.repos.length);
    box.innerHTML=`<div class="opshead"><b>Start in Ops</b></div>
      <p>Opens a GitHub issue from this task. From then on it shows on the Ops board, an agent can be put on it, and its column here follows the issue.</p>
      ${!START?`<p class="muted">Checking what you can start…</p>`:!s.canStart?`<p class="opserr">${esc(s.why||"You can't start tasks.")}</p>`:writeMode!=="live"?`<p class="opserr">The shared board isn't reachable, so this can't be linked. Reload to try again.</p>`:""}
      <div class="opsrow"><select class="field" id="opsRepo" aria-label="Repository"${can?"":" disabled"}>${(s.repos||[]).map(r=>`<option${r===s.suggested?" selected":""}>${esc(r)}</option>`).join("")}</select>
      <button class="btn primary" id="opsStart"${can&&!starting?"":" disabled"}>${starting===t.id?"Starting…":"Start in Ops"}</button></div>
      ${err?`<p class="opserr">${esc(err)}</p>`:""}`;
  }
  title.insertAdjacentElement("afterend",box);
  const go=box.querySelector("#opsStart"); if(go)go.onclick=()=>startInOps(t.id,box.querySelector("#opsRepo").value);
}
async function startInOps(id,repo){
  if(!byId(id)||starting)return;
  starting=id; delete startErr[id]; refreshDrawer();
  // Unsaved edits to the title or text go first, so the issue carries them.
  const a=document.activeElement; if(a&&a.matches&&a.matches(".drawer [data-k]"))a.dispatchEvent(new Event("change"));
  await new Promise(r=>{const w=()=>queue.length||inflight?setTimeout(w,150):r();w();});
  let ref=null;
  try{const r=await api("POST",{id,repo},"","/api/mitra/start");ref=r.issue;toast(`${id} started as ${ref}.`);}
  catch(e){
    if(e.status===409&&e.body&&e.body.issue){ref=e.body.issue;toast(e.message);}
    else startErr[id]=e.message;
  }
  starting=null;
  if(ref){const x=byId(id);if(x){x.issue=ref;const b=B&&B.t.get(id);if(b)b.issue=ref;}}
  if(!busy())renderMain(); refreshDrawer(); poll(); pollLive();
}

/* ---------- boot ---------- */
renderShell(); renderMain();
const C=window.claude;
if(C&&typeof C.use==="function"){
  C.use("artifact").then(ns=>{artifactNS=ns;writeMode=ns?"shared":"local";renderTop();renderNotices();}).catch(()=>{writeMode="local";renderTop();renderNotices();});
  C.use("downloads").then(ns=>{downloadsNS=ns;const b=$("#expBtn");if(b)b.hidden=!ns;}).catch(()=>{});
}else{goLive();}
})();
</script>
</body>
